services:
  - type: web
    name: xsigndrive
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AWS_ENDPOINT_URL_S3
        value: https://t3.storage.dev
      - key: AWS_REGION
        value: auto
      - key: S3_BUCKET
        value: xsigner
      - key: PUBLIC_BASE_URL
        value: https://xsigndrive.onrender.com
      - key: MAX_IPA_BYTES
        value: "4294967296"
      - key: IPA_URL_TTL_SECONDS
        value: "86400"
      - key: UPLOAD_RATE_LIMIT
        value: "5"
      - key: UPLOAD_RATE_WINDOW_MS
        value: "900000"
      - key: CLEANUP_INTERVAL_MS
        value: "900000"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
